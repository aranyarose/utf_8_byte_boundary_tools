[project]
name = "utf-8-byte-boundary-tools"
version = "0.1.1"
description = "Finds how many bytes are missing to finish a UTF-8 sequence at the end of a byte buffer"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
